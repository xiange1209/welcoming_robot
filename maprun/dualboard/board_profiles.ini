# ═══════════════════════════════════════════════════════════════════════════════════════════
# 板子設定檔：single（原廠單板）／A（雙板 8 GB，車上）／B（雙板 4 GB，感知）
#
#   要改什麼看這一份；檢查與套用用同目錄的 board_profile.py（它只讀這個檔，值不要寫死在別處）。
#     python3 ~/maprun/dualboard/board_profile.py status            這塊板子現在是哪一種、哪幾項不符（不用 sudo）
#     python3 ~/maprun/dualboard/board_profile.py plan A            改成 A 會動到什麼（只列出、不改）
#     sudo python3 ~/maprun/dualboard/board_profile.py apply A      真的改：先備份 → 逐項套用 → 自動 status
#   換值：改這個檔 → 再 apply 一次（可重複執行，已經符合的項目不會動）。
#   還原：apply single（＝2026-10-23 這張卡改回 wheeltec-r680 的狀態）。
#   備份與紀錄：~/maprun/logs/board_profile/（backups/<時間>_<profile>/、apply_<時間>_<profile>.txt；collect_data.sh 會帶回筆電）
#
# ★ 2026-10-23 車上 agent 寫。把「set_board_name.sh＋nm_eth0_setup.sh＋dualboard_mode.sh＋README 的安裝步驟」
#   收成一份。舊腳本還在、行為沒變，但它們有一個 bug 這份才修：
#   cloud-init 每次開機都依範本重寫 /etc/hosts（user-data 的 manage_etc_hosts: true 蓋過 cloud.cfg.d 的 false），
#   所以 set_board_name.sh 加的 smartnav-a／smartnav-b 兩行重開機就不見（10/23 在 B 上實際看到）。
#   這份改的是範本 /etc/cloud/templates/hosts.debian.tmpl，開機前後內容一樣。
# ═══════════════════════════════════════════════════════════════════════════════════════════
#
# 每一項是什麼、改在哪裡（agent 要動之前先看這段）：
#
#   mem_gb               這塊板子應有的記憶體（any＝不檢查）。對不上時 apply 會拒絕（SD 卡插錯板），要硬改加 --force-mem
#   hostname             hostnamectl → /etc/hostname。A／B 另放 /etc/cloud/cloud.cfg.d/99-smartnav-hostname.cfg
#                        （preserve_hostname: true），不然每次開機 cloud-init 會改回 user-data 的 wheeltec-r680。
#                        single 不放這個檔＝交回 cloud-init。
#                        /etc/hosts 的 127.0.1.1 行會跟著改成 cloud-init 開機時會寫的樣子，所以 sudo 不會出現「unable to resolve host」。
#   eth0_ip              兩板之間網路線的固定 IP；none＝不設（eth0 照原樣 DHCP，NM 自動產生「Wired connection 1」）。
#                        方法看 [common] eth0_method：
#                          nm       ＝NetworkManager 連線 dualboard-eth0（存在 /etc/netplan/90-NM-<uuid>.yaml）
#                                     ＋/etc/NetworkManager/conf.d/60-dualboard-eth0.conf（ignore-carrier：沒插線也保有 IP，10/22 實測有效）
#                          fallback ＝eth0_static_fallback.sh 的 systemd 單元 smartnav-eth0.service（nm 不行時的備案）
#                        不碰 Wi-Fi。
#   hosts_peers          yes＝/etc/hosts 加 [common] peer_hosts 那幾行（ssh car-b、ping smartnav-a 用）。
#                        改在 cloud-init 範本（見上面 ★），/etc/hosts 當場也改好。
#   role                 ~/.smartnav/dualboard_role（A／B／none）。存在＝所有 source ~/maprun/env.sh 的腳本吃雙板 DDS
#                        （domain 42、只走 eth0、SUBNET；值在 overlay.sh），不存在＝單板（domain 0、LOCALHOST）。
#   hmi_service          smartnav-hmi.service 開機自啟：enabled／disabled。B 要 disabled（不然會有兩個 HMI、兩套單元管理）。
#   hmi_dualboard_dropin yes＝裝 /etc/systemd/system/smartnav-hmi.service.d/50-dualboard.conf（內容＝同目錄 systemd/ 下那份）。
#                        HMI 是 systemd 服務、不 source env.sh，DDS 值要靠這個檔；值必須與 overlay.sh 一致。
#                        改了要重啟 HMI 才生效（會停掉 HMI 開著的單元）→ apply 不自己重啟，除非加 --restart-hmi。
#   perception_service   B 的 smartnav-perception.service（相機＋人臉＋認證＋語音，launch/perception_b.launch.py）：
#                        enabled＝安裝並 enable --now；absent＝停掉並移除單元檔。
#   powerlog_service     B 的 smartnav-b-powerlog.service（行動電源欠壓／降頻紀錄，選用）：enabled／absent。
#   time_sync            default          ＝系統預設（timesyncd 或 chrony 對網路 NTP；不放任何雙板校時設定）
#                        chrony_server    ＝A：裝 chrony（要網路）＋/etc/chrony/conf.d/50-dualboard-server.conf，當 B 的校時伺服器
#                        timesyncd_from_a ＝B：/etc/systemd/timesyncd.conf.d/50-dualboard.conf（NTP＝A）＋enable systemd-time-wait-sync
#                        兩塊 Pi 都沒有硬體時鐘，B 又連不到外面：不做這個，B 的時間停在上次關機，跨板時間戳全錯。
#   bashrc_label         yes＝~/.bashrc 加板子標示區塊（提示字元 [A·8GB]／[B·4GB]，依實際記憶體判斷；和 hostname 對不起來＝卡插錯板）。
#
# 不在這裡、兩塊板子一樣的東西（不用改）：src 與 maprun 程式、cyclonedds_dualboard.xml、launch/perception_b.launch.py、
# HMI 的 SMARTNAV_REMOTE_UNITS（預設清單）。跨板連線測試用 check_dualboard.sh（要先插網路線、兩板都開）。

[common]
# role 檔、.bashrc 的擁有者與家目錄
user = user
home = /home/user
# 這張卡 cloud-init user-data 寫死的名字（/boot/firmware/user-data 的 hostname:）。
# cloud-init 每次開機把 /etc/hosts 寫成「127.0.1.1 <現在的 hostname> <這個名字>」＋範本其他行。
userdata_hostname = wheeltec-r680
# nm 或 fallback（見上面 eth0_ip）
eth0_method = nm
# hosts_peers = yes 時加進 /etc/hosts 的行（A、B 的 eth0_ip 要和這裡一致）
peer_hosts =
    10.10.10.1   smartnav-a car-a
    10.10.10.2   smartnav-b car-b

[single]
description = 原廠單板：SD 卡原樣，一張 8 GB 板子跑全部功能；2026-10-23 這張卡已改回這個
mem_gb = any
hostname = wheeltec-r680
eth0_ip = none
hosts_peers = no
role = none
hmi_service = enabled
hmi_dualboard_dropin = no
perception_service = absent
powerlog_service = absent
time_sync = default
bashrc_label = no

[A]
description = 雙板 A（8 GB，車上）：底盤＋導航＋HMI＋LLM；Wi-Fi 連平板與筆電，網路線連 B
mem_gb = 8
hostname = smartnav-a
eth0_ip = 10.10.10.1/24
hosts_peers = yes
role = A
hmi_service = enabled
hmi_dualboard_dropin = yes
perception_service = absent
powerlog_service = absent
time_sync = chrony_server
bashrc_label = yes

[B]
description = 雙板 B（4 GB，行動電源）：相機（人臉模式）＋人臉＋認證＋語音輸入；正式運作只接網路線
mem_gb = 4
hostname = smartnav-b
eth0_ip = 10.10.10.2/24
hosts_peers = yes
role = B
hmi_service = disabled
hmi_dualboard_dropin = no
perception_service = enabled
powerlog_service = enabled
time_sync = timesyncd_from_a
bashrc_label = yes
