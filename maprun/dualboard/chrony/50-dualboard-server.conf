# /etc/chrony/conf.d/50-dualboard-server.conf（只放 A）
#
# A 用 Wi-Fi 對網路時間校時，同時當網路線另一端 B 的校時伺服器。
# 兩塊 Pi 都沒有硬體時鐘（記憶：開機牆鐘會跳，實測差過 28 天），B 又連不到外面：
# 不做這個，B 的時間會停在上次關機的時間，跨板的訊息時間戳與 TF 全部對不上。
#
# 安裝：sudo apt install chrony   （會自動取代 systemd-timesyncd）
#       sudo install -m 644 50-dualboard-server.conf /etc/chrony/conf.d/ && sudo systemctl restart chrony
# 確認：chronyc tracking（A 自己有對上網路時間）、chronyc clients（看得到 10.10.10.2）
allow 10.10.10.0/24
# A 自己還沒對上網路時間時也照樣發時間 —— 兩板「彼此一致」比「絕對準確」重要
local stratum 10
