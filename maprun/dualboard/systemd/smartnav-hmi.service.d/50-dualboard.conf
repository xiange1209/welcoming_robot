# /etc/systemd/system/smartnav-hmi.service.d/50-dualboard.conf（只放 A）
#
# HMI 服務不 source ~/maprun/env.sh：它的 ROS／DDS 環境直接寫在服務本身的 Environment= 裡（連管理者密碼也在那裡）。
# 雙板時要換成跟 env_dualboard.sh 相同的值，否則 HMI 與它開起來的單元（導航、LLM…）看不到 B 的人臉與語音。
# ★ 這幾個值要與 overlay.sh 完全一致（test_dualboard_env.py 與 check_dualboard.sh ⑤ 會比對）。
# 同名的 Environment 後面蓋前面；服務裡其他 Environment（含密碼）不受影響，也不必改原本的服務檔。
#
# 安裝：sudo mkdir -p /etc/systemd/system/smartnav-hmi.service.d
#       sudo install -m 644 50-dualboard.conf /etc/systemd/system/smartnav-hmi.service.d/
#       sudo systemctl daemon-reload && sudo systemctl restart smartnav-hmi
#       ★ 重啟 HMI 會一併停掉它開著的單元（它們是 HMI 的子行程），挑車子停著的時候做。
# 復原：刪掉這個檔，再 daemon-reload＋restart。
[Unit]
# 備案（eth0_static_fallback.sh）用的單元；沒裝備案時這行無害
After=smartnav-eth0.service

[Service]
Environment=CYCLONEDDS_URI=file:///home/user/maprun/dualboard/cyclonedds_dualboard.xml
Environment=ROS_DOMAIN_ID=42
Environment=ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET
Environment=SMARTNAV_DUALBOARD=1
Environment=SMARTNAV_BOARD=A
