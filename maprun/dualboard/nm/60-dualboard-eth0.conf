# /etc/NetworkManager/conf.d/60-dualboard-eth0.conf（A、B 都放；由 nm_eth0_setup.sh 安裝）
#
# 讓 eth0 沒插網路線也保有固定 IP。
# CycloneDDS 綁在 eth0（cyclonedds_dualboard.xml）；eth0 沒有位址時，該板所有 ROS 節點都會起不來。
# A 是車子本體，不能因為網路線沒插、或 B 沒開機就不能動。
#
# ★ 2026-10-22 筆電端審查：ignore-carrier 兩種寫法都放。
#   [main] 的 ignore-carrier=interface-name:eth0 是最早就有的寫法；[device-…] 區段裡的是較新的寫法
#   （車上是 NetworkManager 1.46，哪一種在這版有效我在筆電上無法驗證）。兩個都放不會互相衝突，
#   不認得的那個會被忽略。
# ★ 實機驗證（README V3）：拔掉網路線重開機後 `ip -br addr show eth0` 仍看得到 10.10.10.x。
#   兩種都沒用 → 改用備案 eth0_static_fallback.sh（不靠 NetworkManager）。
# 復原：刪掉這個檔，sudo systemctl reload NetworkManager
[main]
ignore-carrier=interface-name:eth0

[device-dualboard-eth0]
match-device=interface-name:eth0
ignore-carrier=yes
