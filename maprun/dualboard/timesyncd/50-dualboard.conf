# /etc/systemd/timesyncd.conf.d/50-dualboard.conf（只放 B）
#
# B 只向 A（10.10.10.1，跑 chrony）校時；B 沒有 Wi-Fi，連不到外面的 NTP。
# 用 systemd-timesyncd（Ubuntu 內建）就夠，不用在沒網路的 B 上裝 chrony。
#
# 安裝：sudo mkdir -p /etc/systemd/timesyncd.conf.d && sudo install -m 644 50-dualboard.conf /etc/systemd/timesyncd.conf.d/
#       sudo systemctl restart systemd-timesyncd
#       sudo systemctl enable systemd-time-wait-sync   ← 讓 time-sync.target 真的等到時間對上；感知服務靠它晚點才開
# 確認：timedatectl timesync-status（Server: 10.10.10.1、Offset 毫秒等級）
[Time]
NTP=10.10.10.1
FallbackNTP=
