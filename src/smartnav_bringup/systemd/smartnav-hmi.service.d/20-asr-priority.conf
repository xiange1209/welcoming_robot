# 2026-11-24（使用者同意）：讓語音辨識與收音的優先權在 HMI 服務底下生效。
#   speech_recognizer_node 的 process_nice=-10、voice_trigger 收音執行緒的 SCHED_FIFO 30，
#   原本因為服務的 LimitNICE=0／LimitRTPRIO=0 都設定失敗（只印一行 WARN）。
#   11/10 手動 renice 實測：所有功能一起開時，說完話到出字 4.69 → 1.38 秒。
# 還原：sudo rm 這個檔案，再 sudo systemctl daemon-reload && sudo systemctl restart smartnav-hmi
[Service]
LimitNICE=-10
LimitRTPRIO=30
