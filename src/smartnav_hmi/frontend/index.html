<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover：底部懸浮導覽列要靠 safe-area 內距避開 iPad 的home 指示條 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#06080c" />
    <!-- 平板「加入主畫面」後以全螢幕執行，展示時不會露出網址列 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- ★ 2026-10-22：主畫面圖示與名稱。圖示放 src/assets 讓 Vite 帶雜湊輸出到 /assets/
         （後端只開放 /、/assets/*、/favicon.svg，放 public/ 會 404，iOS 就改用網頁截圖當圖示）。
         改了圖示要把主畫面上的舊圖示刪掉、重新「加入主畫面」才會換。 -->
    <link rel="apple-touch-icon" href="/src/assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="SmartNav 迎賓" />
    <title>SmartNav 智慧銀行迎賓系統</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
