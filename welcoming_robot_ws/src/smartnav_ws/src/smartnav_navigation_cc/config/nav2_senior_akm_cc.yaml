# =============================================================================
# Nav2 參數 - wheeltec senior_akm (奧克曼常規型) / ROS 2 Jazzy / Raspberry Pi 4
# =============================================================================
# 車身 footprint：採用原廠 param_senior_akm.yaml 的定義 (2026-07-29)
#   footprint = [-0.09, 0.40] x [±0.185]
#   **base_footprint 位在後輪軸心**，不是車身中央 ——
#   所以車尾只有 0.09 m，車頭卻伸出 0.40 m。總長 0.49 m、寬 0.37 m。
#   padding    = 0.02
#   inscribed  = 0.185 + 0.02 = 0.205 m
#   circumscribed = sqrt(0.40² + 0.185²) + 0.02 = 0.461 m
#
#   曾經誤用「車身中央」的假設寫成 [-0.22, 0.24]，等於讓 costmap 以為車頭
#   只到 0.24 m —— 實際車頭有 16 公分是「隱形」的，規劃器覺得過得去、
#   車子卻會撞上，這很可能是實測撞到雜物的原因之一。
#
#   ██ 這一段從 7/29 到 8/14 都是錯的，2026-08-14 實機推翻，保留當教訓 ██
#
#   原文寫：「inflation_radius (0.22) 小於 circumscribed (0.461) 是刻意的，
#   走廊淨寬只有 0.99 m，膨脹半徑若真的放到 0.46 會把整條走廊封死。」
#
#   ★ 「封死」這個推論是錯的。**膨脹層不決定可行性**：nav2 的 253
#     （內接致命）帶固定在 inscribed_radius = 0.205，與 inflation_radius 無關；
#     inflation_radius 只決定 253 之外那條衰減尾巴多長。把它放大只是讓
#     成本變高，不是讓格子變成障礙物。可通行帶始終是 0.967 - 2×0.205 = 0.557 m。
#
#   ★ 而且方向剛好相反：小於 circumscribed 時 nav2 **無法用位能場快篩**，
#     每輪都要做完整車體碰撞檢查。實測 0.35 -> 0.55 讓 /cmd_vel 從
#     6.14 Hz 變 9.01 Hz、車速從 0.089 m/s 爬行變 0.257 m/s 滿速。
#     nav2 自己也一直在噴 ERROR 說「HIGHLY recommended 至少設成最大截面的一半」。
#
#   ★★ 這個錯誤信念擋了正確的修法整整兩週 —— HANDOFF_20260731.md 就記過
#      那則 ERROR，但因為相信「放大會封死走廊」而沒有人去試。
#      **教訓：當上游套件持續警告你某個設定不對，而你的理由是一句沒算過的推論，
#      先算一次或試一次，不要把推論當成已知。**
#
#   現值 0.55（local 與 global 皆同），> circumscribed 0.467。
#   實際碰撞仍由 MPPI 的 consider_footprint (真實車形檢查)
#   與 collision_monitor 的 FootprintApproach 把關，不靠膨脹層硬擋。
#
# 座標系：map -> odom_combined -> base_footprint
#   odom_combined 由 turn_on_wheeltec_robot 的 robot_localization ekf_node 發布。
#   map -> odom_combined 在「同一時間只會有一個發布者」：
#     建圖模式 = slam_toolbox，導航模式 = amcl。
#     兩者的生命週期由 map_service_cc 節點獨佔管理，nav2 的 lifecycle_manager
#     絕對不可以再去管 amcl / map_server / slam_toolbox。
# =============================================================================

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom_combined"
    global_frame_id: "map"
    # === 2026-08-03 改用過濾後的掃描 ===
    # scan_filter_cc 會把車尾 140~220 度遮掉再發到 /scan_slam。
    #
    # 原本 AMCL 吃原始 /scan。操作者跟在車後遙控時（教導路徑錄製、手動建圖
    # 都是這樣），人是一個橫跨約 123 度、距離 0.5~0.76 m 的巨大未知障礙，
    # 那些光束全部對不上地圖 -> 粒子權重被扭曲。
    # 走廊本來就有沿長軸的定位歧義（平行牆在任何位置都吻合），兩者疊加
    # 就會整團跳掉：實測教導路徑錄製時 AMCL 瞬移 3.85 公尺，
    # 整條路徑前後半段落在不同座標系而報廢。
    #
    # 代價是少掉車尾 80 度的光束。在走廊裡那個扇區看到的是同樣的兩面平行牆，
    # 本來就提供不了沿軸資訊，所以損失很小；換來的是對「人跟在後面」免疫。
    scan_topic: scan_slam
    map_topic: map

    # 阿克曼底盤沒有專用的運動模型，Nav2 只提供 Differential / Omni。
    # Differential 是正確選擇：它描述的是「里程計雜訊」而不是底盤的運動學限制。
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2 # 旋轉估計中來自旋轉的雜訊
    alpha2: 0.2 # 旋轉估計中來自平移的雜訊
    alpha3: 0.2 # 平移估計中來自平移的雜訊
    alpha4: 0.2 # 平移估計中來自旋轉的雜訊
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    # 似然場的最大考慮距離。調小 = 匹配更銳利、對角度誤差更敏感，
    # 正是走廊環境需要的 (2.0 太寬鬆，偏個十幾度分數也差不多)。
    laser_likelihood_max_dist: 1.2
    laser_max_range: 12.0 # 鐳射實際量程，設 -1 會讓似然場計算包含無效點
    laser_min_range: -1.0
    # === 60 -> 240 (2026-07-28) ===
    # 這台雷達每圈 450 點，max_beams 60 等於只用了 13% 的資料、每 6 度才取一個點。
    # 在長直走廊裡兩側是平行牆，角度資訊本來就只藏在少數特徵上，
    # 取樣這麼稀疏根本分不出車頭偏了十幾度 —— 實測導航後 yaw 誤差 13.9 度，
    # 車子因此偏離走廊中線 12 公分。
    #
    # 佐證：拿同一幀雷射去暴力比對地圖，正確位姿的吻合度是 99.8%、
    # 錯誤位姿只有 28% —— 資料本身足以定位，是 AMCL 沒把它用上。
    # 240 點 (每 1.5 度) 讓角度估計有足夠的判別力。
    # 代價是 CPU，但相機在導航時已經關掉 (camera_manager_cc)，撥得出來。
    max_beams: 240
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    # 測量雜訊的標準差。調小讓權重分布更尖銳，粒子之間的優劣更容易分開；
    # 配合上面加密的 max_beams，才拉得動被 IMU 零偏帶偏的粒子雲。
    sigma_hit: 0.1
    lambda_short: 0.1
    # ★★ 2026-08-19：false -> true ★★
    #
    # 使用者的需求（原話）：「應該要自行判斷椅子在哪而閃避 因為正式展示會很多人
    # 有可能會有人擋住」。也就是**發表當天雷射一定會看到地圖上沒有的東西**。
    #
    # 實測病徵：大廳多了一張椅子之後，「大廳 -> 起點」連續四趟失敗，
    # 訊息都是 `偏離路徑 72 / 86 / 91 / 127 cm`。在 0.99 m 走廊裡偏離 127 cm
    # 物理上不可能 —— 是 AMCL 被那些「對不上地圖」的光束把粒子權重帶歪了。
    # 掃描吻合度從 95~100% 掉到 78.6%，而 max_beams 是 240，
    # 掉幅約 11~21% ≈ 26~50 個光束，規模跟一張椅子對得上。
    #
    # `do_beamskip` 就是 AMCL 為這件事準備的機制：**某條光束若在夠多粒子上
    # 都跟地圖對不起來，就判定它打到了地圖上沒有的東西，跳過不計入權重。**
    # 這正好是「椅子」與「站在車前的人」的情況。
    #
    # 三個門檻維持 AMCL 預設（beam_skip_distance 0.5 / error_threshold 0.9 /
    # threshold 0.3）。★ error_threshold 0.9 是安全閥：被跳過的光束超過 90%
    # 就強制做完整更新 —— 避免「整個場景都變了」時反而把所有證據都丟掉。
    #
    # ⚠ 代價：真實的環境變化（例如牆被移走）會比較慢才被接受。
    #   對這個專案是划算的 —— 地圖是靜態走廊，變的是人和椅子。
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    # === 自我恢復機制 (2026-07-28 啟用) ===
    # 原本沿用舊設定的 0.0 = 完全關閉。在這台車上這是不能接受的：
    #
    # 底盤 IMU 有 +4.54 度/分鐘 的陀螺儀零偏 (靜止實測 z 軸角速度 0.00132 rad/s)，
    # odom 的 yaw 會持續漂。車子靜置一段時間後 AMCL 的粒子雲整團被帶到錯誤角度，
    # 而 alpha 為 0 時沒有任何隨機粒子注入，粒子全部困在錯誤位置，
    # 光靠 request_nomotion_update 重新加權救不回來 —— 實測位姿偏 38 度，
    # 雷射與地圖吻合度只有 28%，導航目標被算到牆裡去。
    #
    # 這兩個值是 Nav2 文件的建議值：長短期權重平均一旦背離就注入隨機粒子，
    # 讓濾波器有機會跳出錯誤的局部解。
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    save_pose_rate: 0.5

    # 阿克曼車不能原地轉，update_min_a 設太大會讓濾波器長時間不更新，
    # 導致 /amcl_pose 遲遲不發布 -> navigation_action_cc 誤判「定位不準」。
    #
    # 又因為 IMU 零偏會讓 odom 持續漂 (見上方 recovery_alpha 的說明)，
    # 門檻越大、兩次觀測更新之間累積的角度誤差就越大。
    # 0.10 m / 0.10 rad (5.7 度) 是在「夠頻繁修正」與「Pi 4 CPU 負擔」之間的折衷。
    update_min_d: 0.10
    update_min_a: 0.10

    tf_broadcast: true
    transform_tolerance: 1.0

    # 初始位姿由 map_service_cc 在 configure 之前用參數服務寫入
    # (建完圖時直接沿用 SLAM 的最後位姿，切換地圖時歸零)。
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: false
    # 實際地圖由 map_service_cc 透過 /map_server/load_map 指定。
    # 這裡故意留空字串：yaml_filename 指向不存在的檔案時 on_configure 會直接失敗，
    # 留空則可以 configure 成功後再載入。
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    # 存檔時 map_server 已退到 unconfigured，map_saver 要等 slam_toolbox 補一張 /map。
    # Pi 4 滿載時 5 秒不夠；map_service_cc 端等 25 秒，這裡必須留在它之內。
    save_map_timeout: 15.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom_combined
    transform_tolerance: 1.0
    # 以下兩個的單位都是「毫秒」，Nav2 的預設值是給桌機等級的機器用的。
    #
    # bt_loop_duration 10 ms = 行為樹每秒 tick 100 次。Pi 4 上這是純粹的浪費，
    # 20 ms (50 Hz) 對 10 Hz 的控制迴圈來說反應仍然綽綽有餘。
    bt_loop_duration: 20
    #
    # default_server_timeout 是「送出 action 目標後等對方確認」的上限。
    # 預設 20 ms —— 這是實測導航一直失敗的真正原因：
    #     Timed out while waiting for action server to acknowledge
    #         goal request for compute_path_to_pose
    #     [navigate_to_pose] [ActionServer] Aborting handle.  (從開始到放棄只有 54 ms)
    # 規劃本身明明是好的 (單獨呼叫 compute_path_to_pose 可以正常回傳路徑)，
    # 純粹是 planner_server 在忙、20 ms 內來不及回 ack 就被判定失敗。
    # 放到 1000 ms：正常情況本來就在幾 ms 內回應，這個值只在系統忙碌時才用得到。
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    always_reload_bt_xml: false
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 行為樹由 launch 檔以絕對路徑覆寫成本包的阿克曼版本 (拿掉 Spin)。
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    odom_topic: odom_combined
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    use_realtime_priority: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 阿克曼車在窄處要來回切換前進/後退才轉得過來，0.25 m / 15 s 太嚴格會誤判卡住。
      required_movement_radius: 0.25
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      # 阿克曼車無法原地修正朝向，yaw 容差必須放寬，否則會在終點附近無限來回。
      yaw_goal_tolerance: 0.5

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # === 2026-08-01 重新配置：視野換取樣本數 ===
      #
      # 舊值 time_steps 20 x model_dt 0.1 = 2.0 秒視野。當時的註解是照
      # 0.35 m/s 算的，但速度後來降到 0.25 m/s，於是：
      #
      #     視野內能前進  0.25 m/s x 2.0 s = 0.50 公尺
      #     最小轉彎半徑                    0.80 公尺
      #     完成 90 度轉彎的弧長 (pi/2)x0.8 = 1.26 公尺
      #
      # **控制器能看到的距離只有完成一次轉彎所需的 40%。** MPPI 是在一個
      # 裝不下該動作的視窗裡做最佳化 —— 它永遠看不到「轉完之後會如何」，
      # 只看得到轉彎的前段，所以評分時分不出好壞。這也是窄走廊裡多段折返
      # (K-turn) 做不出來的原因：倒車段在視野內只走得了 0.24 公尺。
      #
      # 拉長視野會線性增加計算量，Pi 4 沒有餘裕，所以拿樣本數來換：
      #
      #     舊  400 條 x 20 步 = 8000 次前向模擬
      #     新  300 條 x 30 步 = 9000 次      (+12.5%)
      #     視野 2.0 -> 3.0 秒，前進距離 0.50 -> 0.75 公尺
      #
      # 在選項有限的窄走廊裡，「看得夠遠」比「取樣夠多」重要。
      #
      # ⚠ model_dt 維持 0.1 與 controller_frequency 10 Hz 一致。改成 0.15
      #   雖然免費拉長視野，但第一步的模型會假設 0.15 秒卻只執行 0.1 秒，
      #   引入系統性的模型誤差，不划算。
      #
      # 驗證：實機看 controller_server 是否仍維持 10.0 Hz。掉速就把
      # batch_size 再降到 240，或把 time_steps 收回 24。
      time_steps: 30
      model_dt: 0.1
      batch_size: 300
      iteration_count: 1

      # 0.35 -> 0.25 (2026-07-28)：窄走廊 + 需要來回修正掉頭的環境，
      # 慢一點讓 MPPI 有更多時間評估、也讓碰撞監控有餘裕反應。
      # 迎賓機器人本來就不需要快。
      vx_max: 0.25
      # 倒車速度刻意比前進慢一半。
      # 深度相機固定在車頭，**車尾只有雷達**，而雷達裝在 0.11 m 高，
      # 地上的雜物它掃不到 —— 倒車等於半盲。而阿克曼車偏偏又很依賴倒車
      # (脫困、三點調頭都要)。慢速讓萬一撞到時衝擊小，也給卡住偵測反應時間。
      # === 2026-08-01 放寬：-0.12 -> -0.15 ===
      # 倒車速度直接決定折返段能走多遠，而折返是窄走廊裡換朝向的唯一手段：
      #     -0.12 m/s x 3.0 秒視野 = 0.36 公尺  ->  換得朝向 25.8 度
      #     -0.15 m/s x 3.0 秒視野 = 0.45 公尺  ->  換得朝向 32.2 度
      # 一次「前進 0.4 m + 倒車 0.4 m」的折返循環約可換 57 度、側向漂移
      # 僅 9.8 公分，三個循環就能掉頭（走廊側向餘裕 ±31 公分，夠用）。
      # 仍然保持比前進慢，理由見上面的半盲問題。
      vx_min: -0.15
      vy_max: 0.0
      # ★★ 2026-08-12：wz_max 1.0 -> 0.35、wz_std 0.4 -> 0.20 ★★
      #
      # 這台車是阿克曼，角速度不是自由變數：|wz| <= |vx| / min_turning_r。
      #     vx = 0.25、min_turning_r = 0.80  ->  |wz| <= 0.3125 rad/s
      # 也就是說 **wz_max: 1.0 比車子做得到的極限大 3.2 倍**。
      #
      # 關鍵在於 nav2 MPPI 怎麼處理超限：AckermannMotionModel::applyConstraints
      # 只夾**平均控制序列**，而 NoiseGenerator 加完雜訊的取樣**不夾**，
      # 改由 ConstraintCritic 罰分（本檔 cost_weight: 4.0）。所以超出可行域的
      # 取樣不是被修正，是被丟進「一律很貴」那一堆 —— 白花 CPU 又壓低鑑別度。
      #
      # 用常態分布算浪費比例（取樣 ~ N(平均, wz_std)，可行帶 ±vx/0.80）：
      #     wz_std 0.40 @ vx 0.25   ->  56% 可行、**44% 浪費**
      #     wz_std 0.20 @ vx 0.25   ->  88% 可行、  12% 浪費
      #     wz_std 0.40 @ vx 0.125  ->  30% 可行、**70% 浪費**  <- 減速區
      #     wz_std 0.20 @ vx 0.125  ->  56% 可行、  44% 浪費
      # ★ 越慢浪費越兇，而窄走廊/門口正是 PolygonSlow 把速度砍半的地方 ——
      #   最需要取樣品質的時候，有效樣本只剩 300 x 30% = 90 條。
      #
      # 收窄之後 batch_size 300 不變，但**有效樣本數約從 170 條變 264 條**，
      # 等於免費多了 55% 的搜尋密度，CPU 一點都沒有多花。
      # wz_max 0.35 略高於物理極限 0.3125，留一點餘裕給平均序列。
      # 退路：改回 1.0 / 0.4。
      wz_max: 0.35
      # vx_std 維持 0.2：vx 的可行帶是 [-0.15, 0.25]，寬 0.40，
      # 0.2 沒有像 wz 那樣離譜。想再省 CPU 時這是下一個可動的旋鈕（試 0.15），
      # ★ 但不要跟上面兩項同時改，否則出事分不出是誰的功勞。
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.20
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.5

      prune_distance: 1.5
      # 路徑有前進/倒車轉折點 (cusp) 時，逐段跟隨而不是硬切過去
      # 路徑有前進/倒車轉折點 (cusp) 時，逐段跟隨而不是硬切過去。
      # 容差放寬 (0.2/0.4 -> 0.25/0.6)：規劃器現在會產生更多段切換，
      # 每個轉折點都要求高精度會讓車子在原地磨很久才肯進到下一段。
      # ██ 2026-08-14：使用者要求「MPPI 也要學會前後打舵調整姿態」，
      #    而這三個參數很可能就是它做不到的原因。先讀完再動手。 ██
      #
      # nav2 MPPI 的 PathHandler 在 enforce_path_inversion: true 時：
      #   setPath()    -> removePosesAfterFirstInversion()
      #                   **把全域路徑在第一個折返點處截斷**
      #   transformPath -> 只有當機器人同時滿足
      #                       距折返點 <= inversion_xy_tolerance
      #                       朝向差   <= inversion_yaw_tolerance
      #                   才推進到下一段（也就是倒車那一段）
      #
      # ★★ 兩個推論，都與 8/14 的實測吻合：
      #
      # (1) **加大預測視野對折返完全沒有幫助。** MPPI 看到的路徑本來就到
      #     折返點為止，折返之後那一段根本不在它的輸入裡。
      #     -> 8/14 實測 time_steps 30 -> 60 毫無反應、/cmd_vel 9.01 -> 8.61，
      #        完全符合。★ 所以**不要再試 time_steps: 100**，那是加長一段
      #        不存在的路，只會再把控制率砍掉三分之二。
      #
      # (2) **推進條件可能根本達不到。** 阿克曼車不能原地修朝向，
      #     要「同時」把位置壓進 0.25 m、朝向壓進 0.6 rad(34°) 是很強的要求。
      #     達不到就永遠停在折返點前反覆嘗試 -> Failed to make progress。
      #     -> 8/14 實測「前方還有 0.46~0.55 m 淨空卻停住」，符合。
      #
      # ★ 最便宜的判別法（不用改任何參數）：跑 MPPI 那趟時錄 /cmd_vel，
      #   看 linear.x **有沒有出現過負值**。
      #     從來沒有負值 -> 它連試都沒試過倒車，問題在上面的推進條件
      #     有負值但轉不夠 -> 才是轉向能力/約束的問題
      #
      # 要做實驗就只動這兩個（ros2 param set 即時生效，不用重啟）：
      #     inversion_xy_tolerance  0.25 -> 0.40
      #     inversion_yaw_tolerance 0.6  -> 1.0
      # ⚠ 代價：折返點到位精度變差，車子可能還沒到位就開始倒車。
      #   在 0.967 m 走廊裡有擦撞風險 —— **這一趟務必有人手放在緊急停止上**。
      #   因為有這個風險，預設**不改**，留給現場帶著人做。
      #
      # 舊註記：容差從 0.2/0.4 放寬到 0.25/0.6，因為規劃器會產生更多段切換，
      # 每個轉折點都要求高精度會讓車子在原地磨很久才肯進到下一段。
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.25
      inversion_yaw_tolerance: 0.6
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        # 底盤物理極限，來自原廠 param_senior_akm.yaml，不要改小
        min_turning_r: 0.80
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        # 300 -> 500：探索參數放激進後，控制器要更強烈地避開接近碰撞的軌跡。
        # 這是「激進但不撞」的關鍵：放寬的是「要不要去」，不是「怎麼過去」。
        critical_cost: 500.0
        # true = 用真實 footprint 做碰撞檢查。false 時 MPPI 只看軌跡中心點，
        # 車身角落壓到牆時中心點仍是合法 cost，於是車子貼著牆走 -> 規劃器回
        # "Start occupied"。代價是 CPU；trajectory_point_step 拉到 3 補回來。
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 3
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        # ★★ 2026-08-14：true -> false ★★
        #
        # 病因（8/14 診斷，見 ~/MPPI診斷_20260814.md 第一節）：
        # 規劃器的 angle_quantization_bins 是 **32**，也就是每格 360/32 = 11.25 度。
        # 路徑點存的 yaw 因此不是連續曲線，是 11.25 度一階的**階梯**。
        #
        # 8/14 log 裡 path_teach_cc 對規劃路徑量到的朝向階躍，全部是那一格的整數倍：
        #     11.2 度 = 1 格(11.25)   21.5 / 21.6 度 = 2 格   22.5 度 = 2 格(剛好)
        #     R=0.80 的單格基元弧長 0.80 x 2pi/32 = 0.157 m，實測 0.154~0.155 m
        #
        # use_path_orientations: true 時，PathAlignCritic 會把取樣軌跡的**朝向**
        # 拿去對齊路徑點存的那個階梯 yaw，權重 25.0（與 PathFollowCritic 並列全場最高）。
        # 等於每經過一格就餵給最佳化器一次 ±5.6 度的階躍誤差。
        #
        # ★ 為什麼教導-重現不會這樣：純追蹤是 k = 2y/L^2，**只吃橫向位置偏移，
        #   完全不讀路徑點的 yaw 欄位**。同一條路徑、同一個階梯，對它不存在。
        #   這就是「MPPI 不像錄製教導那麼順」的其中一個結構性差異，
        #   而且它是四項差異裡唯一一個「改一個布林值就能測」的。
        #
        # 代價：MPPI 失去「對齊路徑行進方向」的能力，可能更會抄近路，
        #       折返點(cusp)附近的判斷也可能變差 —— **驗收時要一起看**。
        # 退路：改回 true，重跑 launch 即生效（symlink-install 不用重建）。
        #
        # ⚠ 2026-08-14 當下**尚未實機驗證**（車子架空中，導航堆疊停著）。
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 25.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        # mode 2 = 允許倒車朝向，阿克曼車必須用這個
        mode: 2
    enable_stamped_cmd_vel: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      transform_tolerance: 1.0
      rolling_window: true
      # 4 -> 5 m：車尾沒有相機，倒車時完全靠這個視窗裡「先前記下的」障礙。
      # 視窗越大、記得越久，倒車越安全。代價是 costmap 更新成本略增。
      width: 5
      height: 5
      resolution: 0.05
      # 採用原廠 param_senior_akm.yaml 的定義 (2026-07-29 改回)。
      # base_footprint 位在**後輪軸心**，不是車身中央 ——
      # 所以車尾只有 0.09 m，車頭卻伸出 0.40 m。
      #
      # 先前誤用「車身中央」的假設寫成 [-0.22, 0.24]，等於讓 costmap 以為
      # 車頭只到 0.24 m，**實際車頭有 16 公分是「隱形」的**。
      # 那正是規劃器覺得過得去、車子卻撞上去的原因之一。
      footprint: "[ [-0.09, -0.185], [-0.09, 0.185], [0.40, 0.185], [0.40, -0.185] ]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # 兩個來源：雷達看遠、深度相機補雷達看不到的低矮障礙。
        # 雷達裝在 0.11 m 高，地上的雜物 / 電線 / 椅腳橫桿它完全掃不到 ——
        # 實測車子就是這樣撞上去卡住的，當時 costmap 一片空白。
        # 相機裝在 0.09 m 高、朝前，正好看得到前方地面。
        observation_sources: scan camera_cloud
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        camera_cloud:
          # 不是驅動原生的 /camera/depth/points ——
          # 那個是 30 Hz 全解析度，光生成就吃掉 34% CPU。
          # 這是 depth_obstacle_cc 降頻降採樣後的版本（5 Hz、1/16 像素）。
          topic: /camera/obstacle_points
          data_type: "PointCloud2"
          marking: true
          # clearing 用雷達做就好。深度相機視野窄 (約 60 度)，
          # 讓它做 raytrace 清除會把視野外的真實障礙誤清掉。
          #
          # 不清除還有一個關鍵好處：**車子前進時相機看到的地面障礙會留在
          # local_costmap 裡**，等一下倒車經過同一個位置時仍然避得開 ——
          # 這是彌補「車尾沒有相機」的主要手段。
          # local_costmap 是 4x4 m 的 rolling window，移出範圍才會消失，
          # 涵蓋範圍對倒車脫困來說綽綽有餘。
          clearing: false
          # 高度過濾：地板本身不能算障礙，太高的東西也不影響通行。
          # 0.03 m 以下視為地面雜訊，0.40 m 以上超過車身高度不必理會。
          min_obstacle_height: 0.03
          max_obstacle_height: 0.40
          # 深度相機近距離量測不可靠，遠距離誤差大且用不到
          obstacle_min_range: 0.15
          obstacle_max_range: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # ★★ 2026-08-12：0.22 -> 0.35、3.5 -> 4.0（這是 MPPI 卡住的根因）★★
        #
        # 8/05 已經在 global_costmap 那一段把病因寫出來了，但**只寫沒改**，
        # 而且寫在 global 底下 —— 真正餵給 MPPI 的是**這裡（local）**。
        #
        # 病因複述：nav2 的 253 帶固定在 inscribed(0.205)，與 inflation_radius
        # 無關；inflation_radius 只決定 253 之外那條衰減尾巴多長。
        #     0.22 - 0.205 = 衰減帶只有 1.5 公分
        #     代價 252 -> 239（252·exp(-3.5·0.015)）之後直接斷崖歸零
        # 對 MPPI 的 CostCritic 而言，成本地圖是**二值的**：0 或 253/254。
        # 300 條取樣軌跡拿到的分數幾乎一樣，最佳化沒有東西可以下降 ——
        # 這正是 8/04 記的「取樣軌跡代價全部一樣高、收斂到零速度而中止」。
        #
        # 新值 cost = 252·exp(-4.0·(d - 0.205))：
        #     d=0.205 -> 252   (內接，硬牆，與原本完全相同)
        #     d=0.25  -> 210
        #     d=0.30  -> 172
        #     d=0.35  -> 141 -> 之後為 0
        # 0.967 m 走廊裡車心可用區間是離牆 0.205~0.762 m，中線 0.4835 -> 代價 0，
        # 中央仍有 0.267 m 的自由帶（不會把走廊封死），只有真的靠向牆才變貴。
        # ★ CostCritic 的 near_collision_cost 是 253，所以 141~210 這段會走
        #   「按比例加分」的分支而不是 critical_cost —— 梯度真的會被用到。
        #
        # ★ 為什麼只改 local 不改 global：
        #   規劃器（讀 global）目前是**好的**（8/06 兩個目標都規劃成功），
        #   控制器（讀 local）是**壞的**。只動壞的那一邊，出事才歸得了因。
        #   global 一起動還會牽扯 analytic_expansion_max_cost: 200 的耦合。
        #
        # ██ 2026-08-14 實機推翻了上面兩段的一部分，先讀這裡再讀上面 ██
        #
        # (1) 0.35 這個**值**選錯了，而且錯的方向跟我下面警告的相反。
        #     我警告「膨脹格數變多會吃 CPU、掉速就改回 0.22」——實機量到的是
        #     **0.35 時 6.14 Hz、0.55 時 9.01 Hz**，愈大愈快，因為 nav2 需要
        #     inflation_radius >= circumscribed(0.467) 才能用位能場快篩碰撞。
        #     0.35 仍小於 0.467，等於強迫每一輪都做完整車體檢查。詳見下方 8/14 那段。
        #     ★ 所以「掉速就改回 0.22」是**錯的處置**，照做會更慢。已作廢。
        #
        # (2) 「只改 local 不改 global」也已作廢 —— 8/14 兩邊都改成 0.55，
        #     並實測規劃沒壞（大廳 17 點 1 折返、起點 36 點 0 折返，都成功）。
        #
        # (3) 但 analytic_expansion_max_cost 的耦合是**真的**，而且 0.55 讓它更緊：
        #     成本 200 對應的離牆距離 d = 0.205 + ln(252/200)/4.0 = 0.263 m。
        #     0.22 時代 d>0.22 的成本就是 0，超過 200 的只有 1.5 cm 的窄帶；
        #     0.55 之後那條帶變成 5.8 cm（0.205~0.263），**寬了約四倍**。
        #     窄轉角做三點轉向時車心本來就會偏離中線，正好落進那一帶
        #     -> Reeds-Shepp 的解析展開被拒 -> 規劃變慢或多繞。
        #     ★ 已同步把 analytic_expansion_max_cost 放到 260（見 planner_server 段）。
        #
        # 退路：三個值一起回到 local 0.22/3.5、global 0.22/3.5、max_cost 200。
        #
        # ★★ 與 HANDOFF_20260731.md:127「不要用 inflation_radius 解決這個」的關係 ★★
        # 那句話**沒有被推翻，它講的是另一件事**，兩者不衝突：
        #   7/31 的情境：車子已經貼到離牆 0.21 m，該格成本 248（幾乎等於致命）。
        #     成本公式 252·exp(-k·(d - 0.205)) 只跟 k 與 inscribed 有關，
        #     inflation_radius 純粹是截斷距離 —— 所以放大它**確實**救不了那一格。
        #     （驗算：新設定下 d=0.21 的成本是 252·exp(-4.0·0.005)=247，幾乎沒變，
        #       正如 7/31 所預測。這次改動沒有假裝能解決貼牆。）
        #   這次的情境：車子**還在自由區**，而自由區裡的成本全部是 0，
        #     MPPI 因此無從選擇「離牆遠一點的那條軌跡」—— 缺的是梯度，不是低成本。
        # 換句話說 7/31 修的是「已經陷進去怎麼出來」，這裡修的是「一開始就別靠過去」。
        # ★ 零成本帶會從 0.527 m 縮到 0.267 m，但**可行帶完全沒變**（253 帶固定在
        #   inscribed 0.205，共 0.557 m）。變貴不等於變不可行，那正是要的效果。
        #
        # 舊註記 (0.30 -> 0.22, 2026-07-28)：
        # 車身內接半徑是 0.205 m (半寬 0.185 + padding 0.02)。膨脹半徑只要
        # 略大於它就能提供「靠近障礙就加分」的梯度，不需要更大。
        #
        # 為什麼非降不可：走廊淨寬只有 0.99 m。膨脹 0.30 m 時兩側各吃掉 0.30，
        # 中間只剩約 0.4 m 的低成本帶。frontier explorer 挑出來的目標幾乎
        # 一定落在膨脹區裡，而規劃器用 footprint 做碰撞檢查會一律拒絕 ——
        # 實測就是 explorer 不斷送出 (7.14, 1.04)、planner 連續數十次回
        # "no valid path found"，車子只能一路倒退。
        #
        # 壓到 0.22 讓可行帶回到約 0.55 m，兩邊標準才對得起來。
        # 安全性不靠膨脹層硬擋，而是靠 collision_monitor 的 PolygonStop
        # 與 MPPI 的 consider_footprint 真實碰撞檢查。
        #
        # 舊註記 (0.35 -> 0.30，cost_scaling 2.0 -> 3.5)：
        # 實測環境的地圖有雜訊 (SLAM 在走廊裡難免留下零星假點)，
        # 膨脹半徑大 + 衰減慢的組合會讓那些雜點把整條通道糊成高成本區，
        # 規劃器就算找得到路，MPPI 也不敢走 -> 看起來像卡死。
        # 調快衰減等於「只有真的很貼近障礙才算貴」，把中間的可行帶讓出來。
        # 安全性由 collision_monitor 的 PolygonStop 與 MPPI 的
        # consider_footprint 真實碰撞檢查把關，不是靠膨脹層硬擋。
        # ★★ 2026-08-14 實測：0.35 -> 0.55，理由跟先前寫的完全相反 ★★
        #
        # 上面那段 CPU 警告（5 格 -> 7 格、x1.9）**方向是錯的**。實機 log 顯示：
        #
        #   [controller_server] ERROR computeCircumscribedCost:
        #     The inflation radius (0.350000) is smaller than the circumscribed
        #     radius (0.467360) ... cannot use costmap potential field to speed up
        #     collision checking ... This may significantly slow down planning times!
        #
        # inflation_radius **小於** circumscribed(0.467) 時，nav2 無法用位能場快篩，
        # 每一次都得做完整車體碰撞檢查 —— 所以 0.35 不是「比較省」，是**強迫走慢路徑**。
        #
        # 同一段走廊、同一個目標，只改這一項的前後對照（2026-08-14 兩趟實跑）：
        #
        #                    0.35          0.55
        #   /cmd_vel        6.14 Hz       9.01 Hz    （目標 10）
        #   最高速度        0.089 m/s     0.257 m/s  （上限 0.25，等於滿速）
        #   零速指令        2 則          0 則
        #   circumscribed ERROR  持續刷屏   完全消失
        #
        # 附帶好處：0.55 在 0.99~1.41 m 的走廊裡等於**整條走廊都有梯度**，
        # 不再是「48% 零成本區 + 一道斷崖」，而 MPPI 正是靠梯度分辨 300 條取樣軌跡的好壞。
        #
        # ★ 仍然沒有解決的：跑約 3 m 後 `Optimizer fail to compute path` ×3
        #   -> `Failed to make progress` 而中止。窄轉角過不去是另一個病
        #   （視野 0.75 m < 90 度轉彎需要的 1.26 m），見 MPPI診斷_20260814.md 的 R5。
        inflation_radius: 0.55
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 1.0
      # activate 時要等 map -> base_footprint。這條 TF 由 map_service_cc 決定模式後
      # 才會出現 (slam_toolbox 或 amcl)，預設 60 秒在 Pi 4 上不一定夠。
      initial_transform_timeout: 300.0
      # 採用原廠 param_senior_akm.yaml 的定義 (2026-07-29 改回)。
      # base_footprint 位在**後輪軸心**，不是車身中央 ——
      # 所以車尾只有 0.09 m，車頭卻伸出 0.40 m。
      #
      # 先前誤用「車身中央」的假設寫成 [-0.22, 0.24]，等於讓 costmap 以為
      # 車頭只到 0.24 m，**實際車頭有 16 公分是「隱形」的**。
      # 那正是規劃器覺得過得去、車子卻撞上去的原因之一。
      footprint: "[ [-0.09, -0.185], [-0.09, 0.185], [0.40, 0.185], [0.40, -0.185] ]"
      footprint_padding: 0.02
      resolution: 0.05
      # 未探索區域維持 unknown，配合規劃器的 allow_unknown 才能往未知區推進。
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        transform_tolerance: 1.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          # === 2026-08-05：改吃過濾後的掃描（根治全域成本地圖污染）===
          #
          # 8/04 實測：沿車子實際開過的路徑取樣 global_costmap，
          #   清空前 13 個取樣點中 11 個 = 254（致命）→ 走廊全段不可通行
          #   清空後 13 個中只剩 2 個
          # 車子明明開得過去、成本地圖說過不去 —— 是地圖錯了。
          #
          # 污染源：這一行原本是 /scan（未過濾）。操作者跟車遙控時站在
          # 車後 0.5~0.76 m、橫跨約 123 度，那些光束全部被標成 254。
          # ★ 而且操作者**走在車子剛開過的那條線上**，所以標記正好落在
          # 走廊中線 —— 就是之後規劃器要用的地方。
          #
          # AMCL 早在 8/03 就改吃 /scan_slam（見本檔 :47），但那次修正
          # **沒有推廣到成本地圖**。同一個感測器、同一個污染源、兩個消費者，
          # 只修了一個。
          #
          # 全域圖為什麼特別嚴重：它不是 rolling_window（本段沒有這個鍵
          # → nav2 預設 false），標記沒有任何時間衰減，唯一的移除手段是
          # 雷射光線實際穿過那一格。而操作者持續遮蔽車尾扇區，人**後面**
          # 那些剛標下去的格子永遠在雷射陰影裡，拿不到清除射線。
          # local_costmap 是 5x5 rolling，標記移出視窗就沒了，所以同樣吃
          # /scan 卻不會現形 —— 這個不對稱正好對上症狀。
          #
          # ★ 不要把 global 改成 rolling_window: true：那會讓靜態地圖只剩
          #   車周圍一小塊，長距離規劃直接壞掉。
          # ★ 不要給這個來源加 inf_is_valid: true：被遮的光束是 inf，
          #   設 true 會讓它們變成 range_max，反而在車後清出一個 80 度、
          #   10 m 深的扇形，把真實障礙從全域圖抹掉。
          topic: /scan_slam
          # scan_filter_cc 是普通 Python 節點（非 lifecycle、無 respawn）。
          # 它掛掉時全域 obstacle 層會**靜默**停止更新，加這行至少會警告。
          expected_update_rate: 1.0
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # raytrace(10.0) > obstacle(3.0)：能清除的距離大於能標記的距離，
          # 關係是對的。（8/04 的交接曾懷疑這兩個「不匹配」造成清除跟不上，
          # 查證後不成立 —— 記在這裡免得下次又去動它。）
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 與 local_costmap 一致：地圖雜訊 + 大膨脹 + 慢衰減會把通道糊死
        #
        # ⚠ 2026-08-05 分析：目前這組數值等於「沒有梯度」，下一步該調它。
        #
        # footprint 半寬 0.185 + footprint_padding 0.02 -> inscribed = 0.205 m。
        # nav2 的 253（致命障礙膨脹）帶固定在 inscribed，**與 inflation_radius
        # 無關**；inflation_radius 只決定 253 之外那條衰減尾巴有多長。
        # 現在 0.22 - 0.205 = **衰減帶只有 1.5 公分**，代價從 252 掉到 239
        # （252·exp(-3.5·0.015)）之後直接斷崖歸零。
        #
        # 後果：成本地圖對規劃器與控制器而言是二值的（沒事 / 死定了）。
        #   - SmacPlanner 的 cost_penalty: 1.4 幾乎沒有東西可以作用，
        #     沒有「走中間」的傾向
        #   - MPPI 的 CostCritic near_collision_cost: 253 只吃 253/254，
        #     收到的是二值訊號 —— ★ 這正是 8/04 記的「MPPI 取樣軌跡代價
        #     全部一樣高、收斂到零速度而中止」。那不是 MPPI 的毛病。
        #
        # ★ 順帶更正一個舊判斷：把 inflation_radius 從 0.30 降到 0.22
        #   **並沒有把可通行帶變寬**。可通行帶是 0.967 - 2×0.205 = 0.557 m，
        #   兩個設定下完全一樣 —— 那次改動只是把梯度刪掉了。
        #
        # 建議值（等 /scan_slam 那項先驗過再改，一次只動一項）：
        #     inflation_radius:   0.22 -> 0.35
        #     cost_scaling_factor: 3.5 -> 4.0
        # 驗算 cost = 252·exp(-4.0·(d - 0.205))：
        #     d=0.205 -> 252  (內接，硬牆，與現在完全相同)
        #     d=0.25  -> 210
        #     d=0.30  -> 172
        #     d=0.35  -> 141
        #     d>0.35  -> 0
        # 0.967 m 走廊裡車心可用區間是離牆 0.205~0.762 m，中線在 0.4835
        # -> 代價 0；靠牆側有一條實質斜坡。
        #
        # ⚠ 與 analytic_expansion_max_cost: 200.0 耦合：離牆 < 約 0.26 m
        #   的格子會超過 200，貼牆的 Reeds-Shepp 解析展開會被拒。中線走法
        #   不受影響，但**門口 0.967 m 轉角本來就是最難的地方**，若出現
        #   「規劃變慢 / no valid path」就把 analytic_expansion_max_cost 放到 260。
        # ⚠ CPU：cell_inflation_radius 從 5 格變 7 格，每個障礙格的膨脹
        #   計算量約 ×1.9。地圖 132×108 格、1 Hz，Pi 4 應該吃得下，
        #   但要看 controller_server 有沒有掉出 10 Hz。
        # 退路：兩個值放回 0.22 / 3.5，重跑 launch 即生效（symlink-install
        #   連 colcon build 都不用）。
        # ★★ 2026-08-14：0.22 -> 0.55，與 local_costmap 同一個理由 ★★
        # planner_server 也在刷同一則 ERROR，而且多附一句：
        #   "Inflation layer either not found or inflation is not set sufficiently
        #    for optimized non-circular collision checking capabilities.
        #    It is HIGHLY recommended to set the inflation radius to be at MINIMUM
        #    half of the robot's largest cross-section."
        # 最大截面的一半就是 circumscribed 0.467，所以 0.22 連建議值的一半都不到。
        # 詳細前後對照見 local_costmap 那段。
        inflation_radius: 0.55
        cost_scaling_factor: 3.5
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    costmap_update_timeout: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      # === 2026-08-01 收緊：0.5 -> 0.25 ===
      #
      # 這個容差與 controller 的 xy_goal_tolerance 是**串接疊加**的，
      # 先前沒有人注意到這件事：
      #
      #     planner tolerance   0.50 m   規劃器找不到剛好到目標的路徑時，
      #                                  回一條到附近 0.50 m 內的就算成功
      #     xy_goal_tolerance   0.25 m   控制器只保證開到那條路徑的終點 0.25 m 內
      #     ────────────────────────
      #     最壞情況             0.75 m
      #
      # 使用者回報「導航成功但不夠精準」，有很大一部分是**設定出來的**，
      # 不是演算法能力不足。收到 0.25 讓最壞情況降到 0.50 m。
      #
      # 風險：容差越小越可能規劃失敗（目標落在膨脹區時找不到夠近的解）。
      # 若實機出現「以前能到的點現在說規劃不出來」，就是這裡收太緊，
      # 往回放到 0.35 再試。
      # 2026-08-10 從 0.25 放寬到 0.50（與上面註解原本描述的值一致）：
      # 地點的登記位姿只要碰到一格高成本，規劃器就整條拒絕，
      # 實測「門口 -> 起點」「門口 -> 大廳」兩條都失敗在這裡。
      tolerance: 0.50
      # Pi 4 上 Hybrid-A* 是整條鏈最貴的一環。0.05 m 網格搜尋一次會超過 4 秒，
      # 降採樣到 0.1 m (格數 1/4) + 角度分箱減半，搜尋量約降到 1/8。
      downsample_costmap: true
      downsampling_factor: 2
      # 探索時目標就在未知區邊界，必須允許穿越 unknown
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # 阿克曼車可倒車，用 Reeds-Shepp 而不是 Dubins
      motion_model_for_search: "REEDS_SHEPP"
      # ★ 2026-08-10 從 0.80 調到 0.76 ★
      # 韌體硬限是 0.75，使用者實測「打滿舵過得去」。0.80 讓規劃器比車子保守，
      # 結果它在大廳／起點附近擠不出乾淨的掉頭，只能排一堆折返，執行時就卡住。
      #     0.80 時：大廳→起點 一律規劃成 2 折返（三趟都是）
      #     0.76 時：規劃成 0 折返、6.85 m
      # ⚠️ 可行性檢查的門檻 0.76 本來是照 0.80 訂的（0.80×0.95），
      #    改了這裡之後那個門檻要一起檢視，否則會對正常輸出誤報。
      #
      # ★★ 2026-08-10 晚間退回 0.80，理由有兩個（不是否定 0.76 的動機）★★
      #
      # (1) **三層必須滿足 韌體 ≤ 控制器 ≤ 規劃器**。
      #     改成 0.76 時控制器（path_teach_cc 的 min_turning_radius）還是 0.80，
      #     等於規劃器產生控制器跟不上的路徑——就是教導路徑那個老問題的翻版
      #     （「示範裡有一個它無法重現的動作」）。
      #
      # (2) **0.76 的餘裕太薄**：韌體硬限 0.750、右滿舵被 Servo_min=1020 截斷後
      #     實際只到 0.7584，而 8/06 直接量到 0.751。設 0.76 只剩 0.2%~1.2%。
      #
      # ★ 退回 0.80 沒有失去任何「原本會動的能力」：大廳→起點 在 0.76 下
      #   雖然規劃得出 0 折返，但十趟實測是「0 折返 6 勝／多折返 5 敗」，
      #   而這條路線本來就在多折返那一邊。真正要修的是**折返做不好**
      #   （見 path_teach_cc 的 _do_escape 連續三點轉向）。
      #
      # ★ 要調回 0.76 之前，先跑 `~/maprun/steer_asym_check_cc.py` 把左右
      #   極限量準，並同步把 path_teach_cc 的 min_turning_radius_right 一起改。
      #   ⚠️ 這個參數是**單一對稱值**，而實車左轉極限 0.944、右轉 0.751
      #      ——它描述不了這台車，左右不對稱的補償做在 path_teach_cc 端。
      # ★★ 2026-08-17：0.80 -> 0.95，理由是一個 10:0 的統計 ★★
      #
      # 當天所有「路徑上有 N 處車子做不到」的警告，**全部都是往左轉，往右轉 0 次**。
      # 機制很乾淨：這個參數是單一對稱值，而車子左右不對稱（實測 左 0.944 / 右 0.751）
      #
      #     往右轉 R=0.80 -> 車子做得到（0.751 < 0.80）  -> 從來沒有警告
      #     往左轉 R=0.80 -> 車子做不到（需要 0.944）    -> 每一次都警告
      #
      # 也就是說 0.80 對右轉是安全的、對左轉是**物理上不可能**的，
      # 規劃器等於系統性地產出一半做不到的轉彎。實機表現就是「照著打舵但轉不過來」，
      # 車子一路往外漂 —— 8/17 大廳→起點那趟就是這樣貼上右牆卡死的
      # （使用者原話：「轉向跟實際路徑不同(轉向不夠) 導致卡在右邊牆上了」）。
      #
      # ★ 這個解釋勝過「離散化假象」那一版（見下面 angle_quantization_bins 的長註解）：
      #   量化誤差應該左右各半，但實測是 10:0。
      #
      # 0.95 是對齊 path_teach_cc 的 min_turning_radius_left（左轉箝制值）。
      # 這樣規劃器產出的每一個轉彎，**兩個方向都做得到**。
      #
      # ⚠ 代價：轉彎變大，0.99 m 走廊裡可能規不出路徑或多出折返點，
      #   而 8/10 的十趟實測規律是「0 折返 6 勝／多折返 5 敗」。
      #   所以改這個值**必須先做純規劃對照**，不要直接上車。
      minimum_turning_radius: 0.95
      # ★★ 2026-08-14：32 -> 64（每格 11.25 度 -> 5.625 度）★★
      #
      # 病因：「路徑上有 N 處車子做不到」的警告，**有一部分是量化的假象**。
      # 可行性檢查是量相鄰點的離散曲率 R = 點距 / 朝向差，而朝向差最小就是一格：
      #
      #     bins 32（11.25 度 = 0.196 rad）：點距 0.15 m -> R = 0.77 m
      #     bins 64（5.625 度 = 0.098 rad）：點距 0.15 m -> R = 1.53 m
      #
      # 也就是說**不管 minimum_turning_radius 設多少**，只要點距夠短，
      # 一格量化就會算出低於門檻的半徑。實測佐證：8/14 六筆可行性警告的角度
      # 全是 11.25 的整數倍（10.8 / 11.2 / 21.5 / 21.6 / 22.5），最緊的都是 0.799 m
      # —— 0.15/0.196 = 0.77，對得上。
      #
      # ★ 這一項對**路線 B（主力）也有效**，不只是 MPPI。
      #   MPPI 那邊的關聯是 PathAlignCritic 在追這個階梯（見 R1 那段）。
      #
      # ⚠ 代價：狀態空間變兩倍，規劃時間與記憶體都會增加。若規劃明顯變慢就退回 32。
      #
      # ★★ 實測紀錄：`ros2 param set /planner_server GridBased.angle_quantization_bins 64`
      #   **回報 "Set parameter successful"、param get 也讀得到 64，但角度仍是 11.2 度**
      #   —— SmacPlannerHybrid 在 configure() 就建好查表，執行期改不動。
      #   這是「param set 不算驗證」的教科書案例，**必須改 yaml 重啟**。
      #
      # ★★★ 2026-08-14 結論：改 yaml 重啟真的測了，**沒有用，已退回 32** ★★★
      #
      #   上面「一格量化造成假象」的推導**只對了一半**。角度確實一律是格子的整數倍
      #   （那是離散化的必然），但**規劃器選的是兩格的轉彎，不是一格**：
      #   bins=64 時仍看到 11.1 度（= 2 × 5.625）配 0.155 m 點距 -> 一樣是 0.799 m。
      #   把格子切細，規劃器照樣用兩格湊出同樣的曲率，**可行性警告完全沒減少**。
      #
      #   而且有代價（同一台車、同一位置、只差這一項的純規劃對照）：
      #
      #                bins=32              bins=64
      #     大廳     17 點 2.42 m 1 折返   20 點 2.64 m **3 折返**
      #     起點     36 點 5.13 m 0 折返   37 點 5.08 m   0 折返
      #
      #   2026-08-10 十趟實測的規律是「0 折返 6 勝／多折返 5 敗」，
      #   所以把大廳那條從 1 折返變成 3 折返是**明確的退步**。
      #
      #   ⚠ 那次比較差點被另一個問題毀掉：`stop_nav_cc.sh` **收不掉 path_teach_cc**，
      #   重啟導航後同時有兩個節點提供同名服務，呼叫隨機落到其中一個，
      #   於是出現「服務回傳失敗、log 卻顯示路徑存檔成功」的矛盾。
      #   做 A/B 之前務必確認節點只有一個。
      angle_quantization_bins: 32
      analytic_expansion_ratio: 3.5
      # 3.0 -> 2.0：解析展開段越長，規劃器越傾向用一條大弧線一次到位，
      # 在小房間裡那種路徑通常不可行。縮短它讓規劃器改用多段短路徑組合，
      # 也就是「前進一點、倒車一點」的調整方式。
      analytic_expansion_max_length: 2.0
      # 允許在原始運動基元之間插值，路徑更貼合窄空間的可行區
      allow_primitive_interpolation: true
      # ★★ 2026-08-14：200 -> 260，跟著 inflation_radius 0.22 -> 0.55 一起調 ★★
      #
      # 這個值本身沒有意義，**它的意義取決於膨脹層**：它是「解析展開路徑上
      # 任一格的成本上限」，而成本是膨脹層算出來的。膨脹一改，同一個數字的
      # 嚴格程度就變了 —— 這是典型的「參數沒動、行為卻變了」。
      #
      # 成本公式 252·exp(-cost_scaling·(d - 0.205))，反推超過 200 的離牆距離：
      #     舊 0.22 / 3.5   ->  d > 0.22 的成本直接是 0，超標帶只有 1.5 cm
      #     新 0.55 / 4.0   ->  d < 0.263 才超標，超標帶 5.8 cm（寬了約四倍）
      #
      # 為什麼這 4 公分要緊：0.967 m 的門口轉角做三點轉向時，車心一定會偏離
      # 中線（那正是轉向的意思），偏到離牆 0.21~0.26 m 是常態。落在超標帶裡
      # 就會讓 Reeds-Shepp 的解析展開被拒 —— 而解析展開正是規劃器產生
      # 「乾淨的三點轉向」的手段，被拒之後只能退回一格一格搜，變慢或多繞。
      #
      # ★ 取值方法：**算出「在新膨脹參數下重現舊鬆緊度」的等效值**，
      #   而不是挑一個看起來夠大的圓整數。
      #
      #     舊：0.22/3.5 + 門檻 200 -> 拒絕帶 = 離牆 0.205~0.22，寬 1.5 cm
      #     新：0.55/4.0，要同樣 1.5 cm 寬 -> 252·exp(-4.0×0.015) = 237.3
      #
      #   取 240。這個值同時滿足兩件事：
      #     - 拒絕帶回到約 1.2 cm（0.205~0.217），與改膨脹之前幾乎一樣
      #     - **仍然 < 253**，所以內接致命格與 LETHAL 格照樣被拒絕
      #
      # ⚠ 一度寫成 260 是錯的：成本上限就是 254，260 等於**整道檢查失效**，
      #   解析展開會被允許穿過內接致命格 —— 那不是「放寬」，是把保護關掉。
      #   （這個檢查是規劃器在 footprint 碰撞檢查之外的第二道保險。）
      # ⚠ 若實機出現「規劃出來的路徑貼牆」，往下調到 220 再試，不要往上加。
      analytic_expansion_max_cost: 240.0
      analytic_expansion_max_cost_override: false
      # === 2.0 -> 1.3 -> 1.05 (2026-07-28) ===
      # 再降一階：使用者要求「可以連續前進後退或轉彎來調整姿態，達到脫困或回頭」。
      # 1.05 幾乎等於「倒車和前進一樣便宜」，Reeds-Shepp 就會大方地產生
      # 三點調頭那種多段切換的路徑 —— 這是阿克曼車在小房間裡唯一的迴轉方式。
      # 完全設 1.0 不好：那樣連空曠處都可能無謂地倒車。
      # 舊註記 (2.0 -> 1.3)：
      # 倒車的代價倍率。2.0 代表「倒車一公尺 = 前進兩公尺」，規劃器因此會
      # 寧可繞遠路也不肯用倒車。但這台車在 0.99 m 寬的走廊裡最小轉彎直徑是
      # 1.6 m，掉頭本來就只能靠「前進一點、倒車一點」反覆修正 (Reeds-Shepp
      # 的 cusp)，代價設太高等於直接把唯一可行的解排除掉，規劃器就回
      # no valid path。1.3 保留「能不倒車就不倒車」的偏好，但窄處願意切換。
      # ★ 2026-08-10 從 1.05 調到 4.0 ★
      #
      # 1.0 = 倒車與前進等價。實測後果：大廳->起點 規劃出
      # 2.34 / 0.16 / 4.97 m 三段（兩次折返），而 4.97 m 的倒車段必定發散。
      #
      # 阿克曼車輛的倒車循跡是**不穩定平衡**：朝向誤差指數成長。
      # 2026-08-10 三趟實測對照：
      #     折返 0 次、6.51 m 一整段        -> success，終點誤差 11 cm
      #     折返 2 次（4.70/0.15/2.16 m）   -> 偏離 76 cm 中止
      #     折返 2 次（2.34/0.16/4.97 m）   -> 偏離 282 cm 中止（單調成長）
      #
      # 所以要的不是「把倒車練好」，是**讓規劃器盡量不要倒車**；
      # 真的必須倒車時（窄轉角）也會因為代價高而選最短的那種。
      # 4.0 = 倒車每公尺相當於前進四公尺，窄處仍走得通但不會濫用。
      # 4.0 太高：不用長倒車了，卻改成 20 次短折返、11.50 m（實際距離 7 m）。
      # 2.5 是 2026-08-10 實測可用值（ros2 param set 即時改，跑出 1 折返 success）。
      reverse_penalty: 2.5
      # 方向切換不額外罰。窄空間掉頭必須來回切好幾次，罰了就掉不了頭。
      change_penalty: 0.0
      non_straight_penalty: 1.20
      # 2.0 -> 1.4：這是「盡量走在通道中央」的傾向強度。
      # 地圖有雜訊時，高成本區到處都是，權重太大會讓 Hybrid-A* 找不到
      # 它認為夠便宜的路而回 no valid path。調低讓它願意接受次佳但可行的路線。
      cost_penalty: 1.4
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      downsample_obstacle_heuristic: true
      use_quadratic_cost_penalty: false
      debug_visualizations: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # 沒有 spin / assisted_teleop：阿克曼車無法原地旋轉，Spin 一定逾時失敗
    # (舊 log 裡的 "Exceeded time allowance before reaching the Spin goal")，
    # 白白吃掉恢復行為的重試次數。行為樹改用 BackUp + Wait + 清 costmap。
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom_combined
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 1.0]
    min_velocity: [-0.25, 0.0, -1.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: "odom_combined"
    odom_duration: 0.1
    use_realtime_priority: false
    enable_stamped_cmd_vel: false

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom_combined"
    # 吃 steering_trim_cc 補償過的指令，而不是直接吃 velocity_smoother 的輸出。
    # 鏈路：velocity_smoother -> steering_trim_cc -> collision_monitor -> 底盤
    # 補償刻意放在碰撞檢查「之前」，補償量設錯也不會繞過安全層。
    cmd_vel_in_topic: "cmd_vel_trimmed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: false
    use_realtime_priority: false
    polygons: ["PolygonStop", "PolygonSlow", "FootprintApproach"]
    PolygonStop:
      type: "polygon"
      # === 2026-07-29 重畫：原本是照「錯的」車身尺寸畫的 ===
      #
      # 舊值 [[0.29,0.23],[0.29,-0.23],[-0.27,-0.23],[-0.27,0.23]] 是依據
      # 舊註解裡的「車身 [-0.22, 0.24] x [±0.185]」畫的 —— 那個尺寸假設
      # base_footprint 在車身中央。但原廠規格是 [-0.09, 0.40]（見
      # wheeltec-akm-footprint 記憶），**base_footprint 在後輪軸心**。
      # footprint 改成原廠值時，這裡沒有跟著改，於是：
      #
      #     車頭  安全區 +0.29 vs 實際車身 +0.40  -> 鼻子有 11 cm 露在保護外(危險)
      #     車尾  安全區 -0.27 vs 實際車身 -0.09  -> 往後多伸 18 cm(倒車過度敏感)
      #
      # 後果實測：車子在房間門口左側貼牆後，這個「多伸 18 cm」的框讓
      # collision_monitor 持續回報 `Robot to stop due to PolygonStop polygon`，
      # **所有方向的指令都被歸零**（固定框不分方向），車子完全無法倒車脫困，
      # BackUp 動作跑滿 40 秒時間額度卻移動 0.00 m。
      #
      # 新值 = 原廠車身外擴 5 cm。車頭終於被保護到，車尾不再過度外伸。
      points: "[[0.45, 0.235], [0.45, -0.235], [-0.14, -0.235], [-0.14, 0.235]]"
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
      # === 停用 (2026-07-29)：在窄走廊裡這個機制物理上行不通 ===
      #
      # 這是一個**固定在車體上、不分方向**的方框：框內出現任何雷射點就把
      # 所有速度指令歸零，不管車子是想往障礙物開過去還是想離開它。
      #
      # 幾何上算一次就知道為什麼不可行：
      #     走廊淨寬 1.0 m、車寬 0.37 m -> 置中時每邊餘裕只有 0.315 m
      #     這個框的半寬是 0.235 m     -> 車子只要偏離中線 0.08 m 就觸發
      # 實測就是這樣：車子貼近左牆後 collision_monitor 持續回報
      # `Robot to stop due to PolygonStop polygon`，倒車指令也一起被歸零，
      # BackUp 動作跑滿 40 秒時間額度卻移動 0.00 m，完全無法自救。
      #
      # 改用下面的 FootprintApproach 取代：它沿著**指令速度方向**投影 footprint
      # 做碰撞預測（time_before_collision 1.5 秒），所以
      #   - 往障礙物開 -> 會擋（該有的保護還在）
      #   - 往空曠方向倒車脫困 -> 放行（這正是原本被鎖死的動作）
      #
      # 要在開闊環境重新啟用就把這行改回 true。
      enabled: false
    PolygonSlow:
      type: "polygon"
      # 同樣重畫對齊原廠車身：車頭前方留 0.35 m、車尾後方 0.16 m。
      # 舊值 [0.60, -0.42] 是對著舊車身尺寸的，車頭方向反而留太少。
      #
      # === 2026-07-31 收窄側向：0.32 -> 0.22 ===
      # 半寬 0.32 m 在 0.99 m 的走廊裡幾乎永遠觸發：
      #     走廊半寬 0.495 m - 多邊形半寬 0.32 m = 車子偏離中線 0.175 m 就中招
      # 實測 log 出現連續 11 秒的 `Robot to slowdown for 50 percents`，
      # 而阿克曼底盤在窄走廊裡本來就會左右修正，偏離 0.175 m 是常態。
      #
      # 收到 0.22（車身半寬 0.185 + 3.5 cm 餘裕）之後，只有真的快擦到側邊
      # 才會減速。**前後方向刻意不動** —— 減速區的用途是「前方有東西要慢下來」，
      # 側向的牆在走廊裡是常態，不該一直觸發。
      points: "[[0.75, 0.22], [0.75, -0.22], [-0.25, -0.22], [-0.25, 0.22]]"
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
      enabled: true
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.05
      min_points: 6
      visualize: false
      enabled: true
    # 停車判斷同樣要兩個來源。只看雷達的話，低於 0.11 m 的障礙
    # 進到 PolygonStop 框內也不會觸發停車。
    observation_sources: ["scan", "depth_cloud"]
    scan:
      source_timeout: 2.0
      type: "scan"
      topic: "/scan"
      enabled: true
    depth_cloud:
      source_timeout: 3.0   # depth_obstacle_cc 是 5 Hz，逾時要放寬
      type: "pointcloud"
      topic: "/camera/obstacle_points"
      # 只取地面以上、車身高度以內的點
      min_height: 0.03
      max_height: 0.40
      # === 停用 (2026-07-31)：相機不開時它會把整台車鎖死 ===
      #
      # collision_monitor 對「來源逾時」的處置是**停住機器人**：
      #     Robot to stop due to invalid source. Either due to data not
      #     published yet, or to lack of new data received within the sensor timeout
      # 相機常態是關的（CPU 不夠，分階段開），/camera/obstacle_points 沒有
      # 資料 -> depth_cloud 永遠 invalid -> 所有導航速度指令被歸零。
      # 這不是安全保護，是「感測器沒開就不准動」。
      #
      # 雷射仍然在（scan 來源 enabled: true），緊急停止的保護還在。
      # 相機點雲繼續餵 costmap 的 obstacle 層做規劃避障，那邊資料斷了
      # 只是不加新障礙，不會鎖車。
      # 之後 camera_manager_cc 若能在開相機時動態把這裡切回 true 再啟用。
      enabled: false
