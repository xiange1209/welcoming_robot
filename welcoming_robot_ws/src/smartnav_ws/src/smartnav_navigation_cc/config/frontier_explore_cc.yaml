# =============================================================================
# frontier_exploration_ros2 參數 - senior_akm 自動探索建圖
# =============================================================================
# 阿克曼底盤的關鍵差異：不能原地轉、最小轉彎半徑 0.8 m。
# 距離門檻若比轉彎直徑還小，規劃器一定回 "no valid path found"，
# explorer 會不斷重選同一個 frontier 而空轉。
# =============================================================================

frontier_explorer:
  ros__parameters:
    use_sim_time: false

    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: navigate_to_pose
    global_frame: map
    robot_base_frame: base_footprint
    frontier_marker_topic: /explore/frontiers
    selected_frontier_topic: /explore/selected_frontier
    optimized_map_topic: /explore/optimized_map

    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1
    map_qos_autodetect_on_startup: false
    costmap_qos_reliability: reliable
    costmap_qos_depth: 10
    local_costmap_qos_reliability: inherit
    local_costmap_qos_depth: -1

    # Pi 4 上 slam_toolbox 的 map_update_interval 是 3 秒，
    # 比地圖更新更快地重算 frontier 只是浪費 CPU。
    # 0.5 -> 1.0：更頻繁重算 frontier，換目標更即時 (激進建圖)。
    # CPU 撥得出來 —— 相機在建圖時是關的。
    map_processing_rate_hz: 1.0

    # 由 map_service_cc 收到 create_map 後才透過 /control_exploration 啟動
    autostart: false
    control_service_enabled: true

    # 完成事件：發 std_msgs/Empty 到 /exploration_complete。
    # 這是 map_service_cc 判斷「探索結束」的唯一依據，
    # 不再像舊版那樣去比對 /rosout 的字串。
    # 注意 on_exploration_complete 是在 return_to_start 分支「之前」呼叫的，
    # 所以 return_to_start_on_complete 設 false 也照樣會發事件。
    completion_event_enabled: true
    completion_event_topic: exploration_complete
    # 探索完就地停下，直接存圖。回起點對阿克曼車是一段額外的長距離導航，
    # 失敗率高又拖時間，而且完成事件早就發出去了。
    return_to_start_on_complete: false

    escape_enabled: true
    mrtsp_solver: dp
    dp_solver_candidate_limit: 12
    dp_planning_horizon: 8
    frontier_map_optimization_enabled: true

    # === goal_preemption 關閉 (2026-07-28) ===
    # 開啟時 explorer 每 8 秒就重新評估並「重送同一個目標」，log 呈現為
    #     Sending frontier goal (mrtsp): dispatch=(1.49, 2.01)
    #     Frontier goal accepted
    # 不斷循環。goal 每次都被 nav2 接受 (accepted)，但後續規劃失敗，
    # 而 explorer 在收到失敗結果之前就又搶佔重送了 ——
    # **失敗因此從來沒有被計入 suppression**，永遠不會跳過不可達的目標。
    #
    # 實測：房間裡有個 frontier 在牆的另一側 (路徑中段整段 cost=99 過不去)，
    # explorer 對它連試 116 次、車子原地卡了兩分多鐘完全沒有進展。
    #
    # 關閉後 explorer 會等目標真正結束才換下一個，suppression 才有機會生效。
    goal_preemption_enabled: false
    goal_preemption_min_interval_s: 3.0
    goal_skip_on_blocked_goal: true

    # SLAM 與 Nav2 在 Pi 4 上都偏慢，每個目標之間留沉澱時間比較不會誤判
    # 沉澱時間從 2.0 縮到 1.0：激進建圖，少等一點
    post_goal_settle_enabled: true
    post_goal_min_settle: 1.0

    # 規劃連續失敗時暫時封鎖該區域，避免一直卡在同一個 frontier
    frontier_suppression_enabled: true
    all_frontiers_suppressed_behavior: stay

    weight_distance_wd: 1.0
    weight_gain_ws: 1.0
    # 巡航速度 0.35 m/s (見 nav2 的 vx_max)，寫太大會低估遠目標的時間成本
    max_linear_speed_vmax: 0.25
    # 1.0 -> 0.35 (2026-07-28)
    # 這個值用在 frontier 評分的「轉向所需時間」估算裡，不是實際速度上限。
    # 調小 = 認為轉向很慢 = 需要大幅轉向的目標時間成本變高，
    # 於是 explorer 會優先挑「車頭方向就到得了」的 frontier。
    #
    # 這對阿克曼車在窄走廊裡是關鍵：走廊只有 0.99 m 寬、轉彎直徑要 1.6 m，
    # 車子根本無法掉頭，只能直線前進或倒車。讓評分自然偏好前方目標，
    # 就不會挑中那些物理上得先掉頭才能到達的點。
    # 0.35 -> 0.12 (2026-07-29)
    # 實測：車子沿走廊前進 3 m 後，explorer 挑了起點後方的 frontier
    # (0.17, 0.80)（size=24，其實是遠距離掠射造成的幻影開口），
    # 而前方真正的 frontier 只有 size=3，評分輸掉 -> 車子掉頭往回開，
    # 然後在 1 m 寬的走廊裡連續 no valid path found + 倒車恢復，完全空轉。
    #
    # 這個值愈小 = 認為轉向愈慢 = 需要大幅轉向的目標時間成本愈高。
    # 0.12 讓「要掉頭才能到」的目標幾乎不可能勝出，
    # 符合這台車的物理限制：走廊 0.99 m、轉彎直徑 1.6 m，掉不了頭。
    max_angular_speed_wmax: 0.12
    sensor_effective_range_m: 1.5

    # --- 阿克曼專屬距離門檻 ---
    # 最小轉彎半徑 0.8 m => 轉彎直徑 1.6 m。目標比這近的話，
    # Reeds-Shepp 得靠多次前進/倒車切換才到得了，成功率低又慢。
    #
    # 1.2 -> 1.6：實測環境有一段只有 0.99 m 寬的走廊，車子在裡面根本無法掉頭，
    # 只能直線進退。門檻拉到轉彎直徑，等於要求「目標要遠到有機會轉過去」，
    # 避免 explorer 一直挑中那些物理上到不了的近距離 frontier ——
    # 那正是舊 log 裡數百行 "All frontiers are temporarily suppressed" 的成因。
    # 1.6 -> 1.2：門檻等於轉彎直徑雖然安全，但地圖初期範圍小 (實測只有 7.3 m)，
    # 要求 1.6 m 會讓近處的 frontier 全部不合格。1.2 m 仍大於車長 0.46 m 的
    # 兩倍以上，Reeds-Shepp 配合倒車到得了。
    # 1.2 -> 0.9 (使用者要求更激進的建圖)
    # 規劃器現在願意用多段前後切換來就位 (reverse_penalty 降到 1.05)，
    # 所以不必再要求目標遠到「一次就能轉過去」。
    # 0.9 m 仍大於車長 0.46 m 的兩倍，不會挑到貼在車頭的無意義目標。
    # 安全性不靠這個門檻把關，而是靠 collision_monitor 與 MPPI 的
    # consider_footprint 真實碰撞檢查 —— 激進但不會撞。
    frontier_selection_min_distance: 0.9
    frontier_candidate_min_goal_distance_m: 0.9
    frontier_visit_tolerance: 0.5

    # === 60 -> 90 (2026-07-28) ===
    # 這是「鄰居 cost 超過多少就視為此 frontier 被擋住」的門檻。
    #
    # 60 在空曠環境合理，但在 0.99 m 寬的走廊裡是災難：實測 global_costmap
    # 膨脹後障礙格 (1979) 比自由格 (1596) 還多，走廊裡**每個位置都貼近牆**，
    # 所有 frontier 的鄰居 cost 都超過 60 -> 全部被濾掉 ->
    # explorer 一啟動就回報 "No more frontiers found" 直接結束。
    # (當時地圖裡實際有 338 個 frontier 格)
    #
    # 90 只擋掉真正的致命障礙 (99/100)，讓膨脹帶裡的候選點留下來。
    # 安全性由規劃器的 footprint 碰撞檢查把關，不需要在這層過度保守。
    # 90 -> 75：90 太寬鬆，會挑到規劃器根本拒絕的膨脹區目標
    # (實測 explorer 送 (7.14,1.04)、planner 連續數十次 no valid path)。
    # 配合 inflation_radius 降到 0.22，75 大致對應「膨脹帶外緣」，
    # 讓 explorer 與規劃器的可行性判斷一致。
    occ_threshold: 75
    # 6 -> 3：窄走廊的 frontier 本來就破碎，群集門檻太大會一併濾掉
    # 3 -> 2：雜物多的小房間，frontier 破碎得更厲害，門檻再放寬才不會漏掉
    min_frontier_size_cells: 2
    sigma_s: 2.0
    sigma_r: 30.0
    dilation_kernel_radius_cells: 1

    goal_preemption_complete_if_within_m: 0.6
    goal_preemption_lidar_range_m: 12.0
    goal_preemption_lidar_fov_deg: 360.0
    goal_preemption_lidar_ray_step_deg: 2.0
    goal_preemption_lidar_min_reveal_length_m: 0.5
    goal_preemption_lidar_yaw_offset_deg: 0.0

    # 2 次規劃失敗就封鎖該區域。不可達的 frontier (例如在牆的另一側)
    # 沒有必要重試更多次。
    frontier_suppression_attempt_threshold: 2
    frontier_suppression_base_size_m: 1.0
    frontier_suppression_expansion_size_m: 0.5
    frontier_suppression_timeout_s: 90.0
    # 窄處掉頭要來回切換好幾次，車子會有很長一段時間 distance_remaining
    # 幾乎沒變化。30 秒太短會把「正在努力掉頭」誤判成卡死而放棄這個 frontier。
    # 60 -> 25：配合關閉 goal_preemption，讓「試不動的目標」更快被放棄。
    # 窄處掉頭確實需要時間，但 25 秒仍足夠一次來回切換；
    # 真正不可達的目標不該讓車子卡兩分鐘。
    frontier_suppression_no_progress_timeout_s: 25.0
    frontier_suppression_progress_epsilon_m: 0.25
    # nav2 在 Pi 4 上要一段時間才全部 active，太早開始記錄失敗會污染 frontier 記憶
    frontier_suppression_startup_grace_period_s: 30.0
    frontier_suppression_max_attempt_records: 256
    frontier_suppression_max_regions: 64
